<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lords & Domains: two strategy games in one. A hidden-Lord board game for 2 to 6 domains, and The First Crown, a world conquest prequel.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<title>Lords &amp; Domains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#d9d5e6;--ink:#1b1830;--muted:#55506e;--win-a:#3048b8;--win-b:#101c58;--win-ink:#ffffff;--win-muted:#b8c0f0;--edge:#f0f0ff;--edge2:#8890c0;
  --gold:#ffe070;--bad:#ff7070;--ok:#8ce07c;--btn:#2a3a9c;--btn-hi:#4058d0;--shadow:0 6px 0 rgba(0,0,0,.25);
  --font:"Pixelify Sans",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0b0d22;--ink:#e8e6f6;--muted:#a09cc0}}
:root[data-theme="dark"]{--page:#0b0d22;--ink:#e8e6f6;--muted:#a09cc0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px}
body{min-height:100vh;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
button,select,input{font:inherit}
[hidden]{display:none!important}
.app{max-width:1280px;margin:0 auto;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.35rem;letter-spacing:.04em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .sub{font-size:.8rem;color:var(--muted);font-weight:400}
.brand i{display:inline-block;width:14px;height:14px;background:var(--gold);box-shadow:3px 3px 0 #c08020;transform:rotate(45deg)}
.btn{background:linear-gradient(#4a60d8,#24308c);color:#fff;border:2px solid var(--edge);border-radius:6px;padding:6px 12px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);text-shadow:1px 1px 0 #000;min-height:36px}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.gold{background:linear-gradient(#ffd860,#c08018);color:#2a1800;text-shadow:none;border-color:#fff4c0}
.btn.red{background:linear-gradient(#e05050,#8c1c24)}
.btn.sm{padding:3px 8px;min-height:30px;font-size:.9rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;align-items:start}
.stage{position:relative;display:grid;gap:8px}
.screenwrap{position:relative;background:#000;border:3px solid var(--edge);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;aspect-ratio:384/240}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctrls .sp{flex:1}
.win{background:linear-gradient(var(--win-a),var(--win-b));color:var(--win-ink);border:3px solid var(--edge);border-radius:8px;box-shadow:inset 0 0 0 1px var(--edge2),var(--shadow);padding:10px 12px}
.win h3{margin:0 0 6px;font-size:1rem;color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
.win p{margin:4px 0;line-height:1.35}
.muted{color:var(--win-muted)}
.side{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.18)}
.dom:last-child{border-bottom:0}
.dom .sw{width:14px;height:14px;border:2px solid #fff;border-radius:3px;grid-row:span 2}
.dom b{font-weight:700}
.dom .meta{font-size:.82rem;color:var(--win-muted);grid-column:2/4}
.dom.dead{opacity:.45}.dom.dead b{text-decoration:line-through}
.dom.turn b::after{content:" ◄";color:var(--gold)}
.chips{display:inline-flex;gap:2px;flex-wrap:wrap}
.chip{display:inline-block;min-width:16px;text-align:center;font-size:.75rem;padding:0 3px;border-radius:3px;background:rgba(255,255,255,.15)}
.chip.l{background:var(--gold);color:#2a1800}
.att{font-size:.78rem;padding:1px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}
.att.Allied{background:#2c8c3c}.att.Friendly{background:#3c7c5c}.att.Hostile{background:#9c2c2c}.att.Wary{background:#8c6c1c}
.drow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.drow select{background:#101c58;color:#fff;border:2px solid var(--edge2);border-radius:6px;padding:4px 6px;min-height:34px}
#log{max-height:220px;overflow:auto;font-size:.88rem;line-height:1.35;display:grid;gap:3px}
#log div{padding-left:8px;border-left:4px solid transparent}
.info{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.info canvas{width:48px;height:72px;image-rendering:pixelated;background:rgba(0,0,0,.25);border-radius:4px}
.bars{display:grid;gap:2px;margin-top:4px;font-size:.8rem}
.bar{display:grid;grid-template-columns:62px 1fr 34px;gap:6px;align-items:center}
.bar i{display:block;height:7px;background:var(--gold);border-radius:2px}
.modal-bg{position:fixed;inset:0;background:rgba(4,6,24,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{max-width:640px;width:100%;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 8px;color:var(--gold);font-size:1.4rem}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.seats{display:grid;gap:6px;margin:8px 0}
.seat{display:grid;grid-template-columns:20px 1fr 200px;gap:8px;align-items:center}
.seat select{background:#101c58;color:#fff;border:2px solid var(--edge2);border-radius:6px;padding:4px;min-height:34px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.rules h3{color:var(--gold);margin:12px 0 4px}
.rules ul{margin:4px 0;padding-left:18px;line-height:1.45}
.rtbl{display:grid;grid-template-columns:36px 1fr;gap:6px 10px;align-items:center}
.rtbl img{width:32px;height:48px;image-rendering:pixelated}
.toast{position:absolute;left:50%;top:26px;transform:translateX(-50%);max-width:90%;z-index:5;pointer-events:none;font-size:.95rem;text-align:center}
.titlemenu{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:4;width:min(96%,640px)}
.titlemenu .br{flex-basis:100%;height:0}
.btn.big{font-size:1.15rem;padding:8px 18px;min-height:46px}
.cards{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.card{display:grid;justify-items:center;gap:1px;width:58px;padding:4px 2px;border:2px solid #fff4c0;border-radius:6px;background:linear-gradient(#f4ecd4,#d8c89c);color:#2a1800;font-size:1.05rem;line-height:1}
.card small{font-size:.6rem;text-align:center;line-height:1.05;color:#4a3410}
.card.k3{background:linear-gradient(#ffe880,#e0a020)}
.odds{display:grid;grid-template-columns:1fr auto;gap:2px 6px;margin-top:6px;font-size:.85rem;align-items:center}
.odds i{grid-column:1/3;display:block;height:6px;background:var(--gold);border-radius:3px}
.lore{font-style:italic;color:#e8dcc0;border-left:3px solid var(--gold);padding-left:10px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
input[type=range]{accent-color:#ffd860}
.vol{display:flex;align-items:center;gap:8px}.vol input{width:140px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.18)}
.seg{display:inline-flex;border:2px solid var(--edge2);border-radius:6px;overflow:hidden}
.seg button{background:#101c58;color:#fff;border:0;padding:4px 10px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--gold);color:#2a1800}
.kbd{font-size:.8rem;color:var(--win-muted)}
.corner{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:80;display:flex;gap:6px}
.corner .nowplay{align-self:center;font-size:.8rem;color:#fff;background:rgba(10,14,50,.82);border:2px solid var(--edge2);border-radius:6px;padding:3px 8px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.corner button.nowplay{cursor:pointer;font:inherit}
.corner button.nowplay:hover{border-color:var(--gold)}
.songs{display:grid;gap:6px;margin:8px 0}
.songs .btn{text-align:left}
.bsels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.bsel{display:grid;gap:3px;font-size:.84rem;color:var(--win-muted)}
.bsel select{background:#101c58;color:#fff;border:2px solid var(--edge2);border-radius:6px;padding:4px;min-height:34px;width:100%}
@media (max-width:560px){.bsels{grid-template-columns:1fr}}
.corner .btn{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.3)}
.coach{border-color:var(--gold);box-shadow:inset 0 0 0 1px #c08020,var(--shadow)}
.coach .cstep{font-size:.8rem;color:var(--win-muted);letter-spacing:.06em;text-transform:uppercase}
.modes2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{display:grid;gap:4px;padding:10px;border:2px solid var(--edge2);border-radius:8px;cursor:pointer;background:rgba(0,0,0,.18)}
.mcard:has(input:checked){border-color:var(--gold);background:rgba(255,224,112,.12)}
.mcard input{accent-color:#ffd860;width:18px;height:18px}
.mcard span{font-size:.86rem;color:var(--win-muted);line-height:1.3}
@media (max-width:560px){.modes2{grid-template-columns:1fr}}
body{padding-bottom:64px}
.sec{color:var(--gold);margin:12px 0 6px;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase}
.pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:4px 0 6px}
.pcard2{display:grid;gap:3px;text-align:left;padding:8px 10px;border:2px solid var(--edge2);border-radius:8px;background:rgba(0,0,0,.22);color:#fff;cursor:pointer;font:inherit}
.pcard2 b{color:var(--gold)}.pcard2 span{font-size:.8rem;color:var(--win-muted);line-height:1.25}
.pcard2:hover,.pcard2.on{border-color:var(--gold);background:rgba(255,224,112,.12)}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px}
.ngrid .seg{flex-wrap:wrap}
.seat .sw{width:16px;height:16px;border:2px solid #fff;border-radius:3px}
.tm{font-size:.72rem;padding:0 6px;border-radius:999px;border:1px solid rgba(255,255,255,.5);vertical-align:middle}
.tm.t0{background:#8c2c3c}.tm.t1{background:#2c4c9c}.tm.t2{background:#2c7c4c}
.sum{margin:12px 0 0;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.25);border-left:4px solid var(--gold);line-height:1.4}
details.look{margin-top:12px;border:2px solid var(--edge2);border-radius:8px;padding:6px 10px;background:rgba(0,0,0,.15)}
details.look summary{cursor:pointer;color:var(--gold);font-weight:600}
details.look[open] summary{margin-bottom:6px}
@media (max-width:560px){.ngrid{grid-template-columns:1fr}}
@media (max-width:900px){.layout{grid-template-columns:1fr}.brand{font-size:1.1rem}}
@media (max-width:520px){.titlemenu{bottom:6px;gap:4px}.titlemenu .btn{padding:3px 7px;min-height:28px;font-size:.78rem}.titlemenu .btn.big{font-size:.9rem;min-height:34px}.seat{grid-template-columns:20px 1fr 150px}.seat select{font-size:.8rem}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand"><i></i>Lords &amp; Domains <span class="sub">· The First Crown</span></div>
    <button class="btn sm" id="bView" title="Switch between the field and the map (V)">View: Map</button>
    <button class="btn sm" id="bRotL" title="Rotate left (Q)" aria-label="Rotate left">⟲</button>
    <button class="btn sm" id="bRotR" title="Rotate right (E)" aria-label="Rotate right">⟳</button>
    <button class="btn sm" id="bZoomIn" title="Closer (+)" aria-label="Zoom in">＋</button>
    <button class="btn sm" id="bZoomOut" title="Further (-)" aria-label="Zoom out">－</button>
    <button class="btn sm" id="bRules">Rules</button>
    <button class="btn sm" id="bSettings">Options</button>
    <button class="btn sm" id="bMenu">Menu</button>
  </div>
  <div class="layout">
    <div class="stage">
      <div class="screenwrap"><canvas id="screen"></canvas>
        <div class="win toast" id="toast" hidden></div>
        <div class="titlemenu" id="titleMenu">
          <button class="btn gold big" id="tNew" title="The hidden-Lord board game for 2 to 6 domains">⚔ Lords &amp; Domains</button>
          <button class="btn gold big" id="tCrown" title="The world conquest prequel">👑 The First Crown</button>
          <span class="br"></span>
          <button class="btn" id="tCont" hidden>Continue Lords</button>
          <button class="btn" id="tCCont" hidden>Continue Crown</button>
          <button class="btn" id="tWalk">Walkthrough</button>
          <button class="btn" id="tRules">How to play</button>
          <button class="btn" id="tSet">Options</button>
        </div>
      </div>
      <div class="win coach" id="coach" hidden></div>
      <div class="win" id="turnBox"><h3>Welcome</h3><p>Two games, one world. Pick one to begin.</p></div>
    </div>
    <div class="side">
      <div class="win" id="infoBox"><h3>Inspect</h3><p class="muted">Hover over or tap a piece to read about it.</p></div>
      <div class="win" id="domBox"><h3>Domains</h3><div id="doms"></div></div>
      <div class="win" id="diploBox" hidden><h3>Diplomacy</h3><div id="diplo"></div></div>
      <div class="win"><h3>Chronicle</h3><div id="log"></div></div>
    </div>
  </div>
</div>
<div class="corner" id="corner" aria-label="Sound and music"></div>
<div class="modal-bg" id="modalBg" hidden><div class="win modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
// ===================== Lords & Domains: rules, diplomacy and AI =====================
// Pure game logic. No DOM. The same code runs in the page and in tests.
const LD=(()=>{
// ---------- the board ----------
// Every board is a graph of tiles. A tile has a centre (x,y), an outline polygon and its neighbours. Tiles are stored
// by id, and (r,c) = (floor(id/N), id%N) so the rest of the code can keep using r,c.
// Two shapes: a six-sided field of hexes, or a square field of squares. 2 to 6 domains, each starting along a side.
let NP=6,ALLP=[0,1,2,3,4,5],CFG={shape:'hex',np:6,army:'full'};
const TILE=16,SQ3=Math.sqrt(3);
let PENT=[],PENT_R=0,ALLT=[],N=0,TILES=[],VALID=new Set(),CELLS=[],NB=[],DIST=[],RAYS=[],RAYAT=[],SIDES=[],SLOTS=[],HOMES=[],WATER=new Set(),ROWW=7;
const M=0,DIRS=null,DIAGS=[];
let ARMY=[9,8,7,6,5,4,3,3,3,3,2,2,1,0];
const ARMIES={full:[9,8,7,6,5,4,3,3,3,3,2,2,1,0],classic:[9,8,7,6,5,4,3,2,1,0]};
// hex: board radius by number of domains (smaller wars, smaller island)
const HEX_R={full:{2:6,3:7,4:8,5:9,6:9},classic:{2:5,3:6,4:7,5:8,6:8}};
function inPent(x,y){const n=PENT.length;for(let k=0;k<n;k++){const a=PENT[k],b=PENT[(k+1)%n];if((b.x-a.x)*(y-a.y)-(b.y-a.y)*(x-a.x)<0)return false}return true}
const tileOf=(r,c)=>TILES[r*N+c];
const cellXY=(r,c)=>{const t=TILES[r*N+c];return t?{x:t.x,y:t.y}:{x:0,y:0}};
const nbrs=(r,c)=>NB[r*N+c]||[];
const hexDist=(r1,c1,r2,c2)=>{const a=TILES[r1*N+c1],b=TILES[r2*N+c2];return a&&b?DIST[a.id][b.id]:99};
const angled=()=>false;
const rescueNbrs=(r,c)=>nbrs(r,c);
function stepFor(dr,dc){return null}
const inLine=()=>false;
function boardSize(cfg){
  const W=ARMIES[cfg.army||'full'].length/2;
  if(cfg.shape==='square'){const per=cfg.np>=5?2:1;return cfg.size||(cfg.np<=2?10:per===2?2*W+5:Math.max(W+4,11))}
  return cfg.size||HEX_R[cfg.army||'full'][cfg.np];
}
function configure(cfg){
  cfg=Object.assign({shape:'hex',np:6,army:'full'},cfg||{});cfg.np=Math.max(2,Math.min(6,cfg.np|0));
  CFG=cfg;NP=cfg.np;ALLP=Array.from({length:NP},(_,i)=>i);ARMY=ARMIES[cfg.army]||ARMIES.full;ROWW=ARMY.length/2;
  const size=boardSize(cfg);cfg.size=size;
  ALLT=[];
  if(cfg.shape==='square'){
    const h=(size-1)/2,B=size/2+.12;
    PENT=[[1,1],[-1,1],[-1,-1],[1,-1]].map(([a,b])=>({x:a*B,y:b*B}));
    const idx={};
    for(let r=0;r<size;r++)for(let q=0;q<size;q++){const x=q-h,y=r-h;idx[q+','+r]=ALLT.length;
      ALLT.push({q,r,x,y,poly:[[.5,.5],[-.5,.5],[-.5,-.5],[.5,-.5]].map(([a,b])=>({x:x+a,y:y+b})),nb:[]})}
    for(const t of ALLT)for(const [dq,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const j=idx[(t.q+dq)+','+(t.r+dr)];if(j!=null)t.nb.push(j)}
  }else{
    const HR=size,BR=HR+.62;
    PENT=[0,1,2,3,4,5].map(k=>{const a=k*Math.PI/3;return{x:BR*SQ3*Math.cos(a),y:BR*SQ3*Math.sin(a)}});
    for(let r=-HR;r<=HR;r++)for(let q=-HR;q<=HR;q++){if(Math.abs(q)>HR||Math.abs(r)>HR||Math.abs(q+r)>HR)continue;
      const x=SQ3*(q+r/2),y=1.5*r;const poly=[0,1,2,3,4,5].map(k=>{const a=Math.PI/6+k*Math.PI/3;return{x:x+Math.cos(a),y:y+Math.sin(a)}});
      ALLT.push({q,r,x,y,poly,nb:[]})}
    const idx={};ALLT.forEach((t,i)=>idx[t.q+','+t.r]=i);
    for(const t of ALLT)for(const [dq,dr] of [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]]){const j=idx[(t.q+dq)+','+(t.r+dr)];if(j!=null)t.nb.push(j)}
  }
  PENT_R=Math.max(...PENT.map(v=>Math.hypot(v.x,v.y)));
  N=Math.ceil(Math.sqrt(ALLT.length))+1;
  TILES=ALLT.map((t,k)=>({id:k,x:t.x,y:t.y,poly:t.poly,nb:t.nb.slice()}));
  VALID=new Set();CELLS=[];
  TILES.forEach(t=>{const r=Math.floor(t.id/N),c=t.id%N;t.r=r;t.c=c;VALID.add(r*N+c);CELLS.push([r,c])});
  NB=[];TILES.forEach(t=>{NB[t.r*N+t.c]=t.nb.map(n=>[TILES[n].r,TILES[n].c])});
  // shortest walking distance between any two tiles (ignoring water), for the computer rulers' planning
  {const n=TILES.length;DIST=new Array(n);for(let s=0;s<n;s++){const d=new Int16Array(n).fill(99);d[s]=0;const q=[s];for(let h=0;h<q.length;h++)for(const m of TILES[q[h]].nb)if(d[m]>d[q[h]]+1){d[m]=d[q[h]]+1;q.push(m)}DIST[s]=d}}
  // Scouts run "straight": through each tile they keep to the neighbour most in line with where they started heading
  RAYS=TILES.map(t=>t.nb.map(n0=>{const ray=[n0];const dx=TILES[n0].x-t.x,dy=TILES[n0].y-t.y,L=Math.hypot(dx,dy);let prev=t.id,cur=n0;
    for(let k=0;k<40;k++){let best=-1,bd=.72;for(const m of TILES[cur].nb){if(m===prev||ray.includes(m)||m===t.id)continue;const ex=TILES[m].x-TILES[cur].x,ey=TILES[m].y-TILES[cur].y;const dot=(ex*dx+ey*dy)/(Math.hypot(ex,ey)*L);if(dot>bd){bd=dot;best=m}}
      if(best<0)break;ray.push(best);prev=cur;cur=best}
    return ray}));
  RAYAT=TILES.map((t,i)=>{const m={};RAYS[i].forEach((ray,ri)=>ray.forEach((b,k)=>{if(m[b]==null)m[b]={ri,k:k+1}}));return m});
  // the sides of the field, starting with the bottom edge and going round
  const n=PENT.length;
  const raw=PENT.map((_,k)=>{const a=PENT[(k+n-1)%n],b=PENT[k];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const L=Math.hypot(mx,my);const len=Math.hypot(b.x-a.x,b.y-a.y);return{mx,my,nx:mx/L,ny:my/L,tx:(b.x-a.x)/len,ty:(b.y-a.y)/len,L,len}});

// ---------- turn loop ----------
async function turnLoop(my){
  while(G&&!G.over&&my===token){
    const p=G.turn;renderAll();
    if(G.ctrl[p]==='ai'){
      setViewer();if(!humans().length)RD.faceDomain(p);
      $('#turnBox').innerHTML=`<h3>${D[p].name} is thinking</h3><p class="muted">${humans().length?'Watch the field. Every clash is fought in the open.':`${['','','Two','Three','Four','Five','Six'][LD.NP]} computer rulers fight it out.`}</p>`;
      await sleep(aiDelay());if(my!==token)return;
      const before=G.log.length;
      LD.aiDiplomacy(G,p);
      for(const l of G.log.slice(before)){if(/pact/.test(l.t))SND.play('pact');else SND.play('rumor');toast(esc(l.t),2200);await sleep(Math.min(900,aiDelay()*2))}
      const m=LD.aiChoose(G,p);
      if(m)await perform(m);
    }else{
      if(isHot()){V.hideAll=true;renderAll();await ask(`${D[p].name}'s turn`,`<p>Pass the screen to the ruler of ${dom(p)}.</p>`,[{t:'Show my domain',v:1,cls:'gold'}]);V.hideAll=false}
      if(my!==token)return;
      setViewer();RD.faceDomain(p);renderAll();
      await handleOffers(p);if(my!==token)return;
      const m=await humanTurn(p);if(my!==token)return;
      if(m)await perform(m);
    }
    if(my!==token)return;
    LD.nextTurn(G);
    const ch=ENV.advance(G.env,G.round);if(ch==='season'){toast(`<b>${ENV.SEASON_NAME[G.env.season]}</b> comes to the island.`,2600);LD.addLog(G,`${ENV.SEASON_NAME[G.env.season]} comes to the island.`)}
    await showQuake(my);
    cueMusic();save();
  }
  if(G&&G.over&&my===token)gameOver();
}

// ---------- performing moves with animation ----------
async function perform(m){
  const x=G.pieces[m.id];const vw=V.viewer;
  const t=m.attack?LD.at(G,m.r,m.c):null;
  const preA=LD.visibleTo(x,vw<0?x.p:vw),preD=t?LD.visibleTo(t,vw<0?t.p:vw):false;
  const positions=G.pieces.map(q=>({r:q.r,c:q.c}));
  const ev=LD.doMove(G,m.id,m.r,m.c);
  V.last={from:{r:positions[m.id].r,c:positions[m.id].c},to:{r:m.r,c:m.c}};
  for(const e of ev){
    if(e.type==='move'){RD.animMove(e.id,e.from,e.to,S.speed==='fast'?160:260);SND.play('move');await sleep(S.speed==='fast'?170:280)}
    else if(e.type==='clash'){
      // keep both fighters on the board during the lunge, then restore the real outcome
      const finalAlive=G.pieces.map(q=>q.alive);const A=G.pieces[e.att];const realA={r:A.r,c:A.c};
      A.alive=true;G.pieces[e.def].alive=true;A.r=e.from.r;A.c=e.from.c;
      RD.animMove(e.att,e.from,e.to,220,true,.4);
      await sleep(240);
      if(S.battle!=='off'){$('#toast').hidden=true;await BT.play({...e,preA,preD},G,vw<0?-1:vw,S.battle)}
      else{SND.play('clash');RD.V.shake=5;await sleep(250)}
      A.r=realA.r;A.c=realA.c;G.pieces.forEach((q,i)=>q.alive=finalAlive[i]);
      // a domain that fell keeps its pieces dead
      for(const q of G.pieces)if(!G.alive[q.p])q.alive=false;
      const wA=RD.worldOf(e.from.r,e.from.c),wD=RD.worldOf(e.to.r,e.to.c);
      if(e.result<=0)RD.burst(wA.x,wA.y,[TM[e.ap].P,TM[e.ap].L,'#fff'],26,1.2);
      if(e.result>=0)RD.burst(wD.x,wD.y,[TM[e.dp].P,TM[e.dp].L,'#fff'],26,1.2);
      if(e.result>0)RD.animMove(e.att,e.from,e.to,200);
      RD.floatText(wD.x,wD.y,e.result>0?'VICTORY':e.result<0?'REPELLED':'BOTH FALL',e.result>0?'#ffe070':'#ff9090');
      await sleep(350);
    }
    else if(e.type==='fall'){
      SND.play('fall');V.shake=10;
      for(const q of G.pieces)if(q.p===e.p){const w=RD.worldOf(q.r,q.c);RD.burst(w.x,w.y,[TM[e.p].P,TM[e.p].L,TM[e.p].Q,'#ffe070'],18,1.5,2.5)}
      toast(e.how==='keep'?`<b style="color:${TM[e.p].L}">The Keep of ${D[e.p].name} is breached!</b><br>The whole domain collapses${e.by!=null?` before ${D[e.by].name}`:''}.`:`<b style="color:${TM[e.p].L}">The Lord of ${D[e.p].name} has fallen!</b><br>The whole domain collapses${e.by!=null&&e.by!==e.p?` before ${D[e.by].name}`:''}.`,3600);
      await sleep(1400);
      if(humans().length===1&&e.p===humans()[0]&&!G.over){
        const c=await ask('Your Lord has fallen',`<p>${dom(e.p)} is no more. The other domains fight on.</p>`,[{t:'Title screen',v:'title'},{t:'Watch the rest',v:'watch'},{t:'New game',v:'new',cls:'gold'}]);
        if(c==='title'){token++;waiting=null;store.set('save',null);showTitle();return}
        if(c==='new'){begin(LC.seats.slice(0,LC.np));return}

      }
    }
    else if(e.type==='betray'){SND.play('betray');toast(`<b style="color:#ff8080">Betrayal!</b> ${D[e.a].name} breaks its pact with ${D[e.b].name}.`,3000);await sleep(600)}
  }

  SND.play(human||!solo?'victory':'lose');
  const names=ws.map(dom).join(' and ');
  UI.modal(`<h2>${solo?(human?'You are the First Lord!':'The world is lost'):`${ws.map(p=>esc(D[p].name)).join(' and ')} win${ws.length>1?'':'s'}`}</h2>
   <p>${names} ${ws.length>1?'unite':'unites'} the world${G.victory==='throne'?', holding Thalmar and two continents':G.victory==='dominion'?', holding most of it':''}.</p>
   <p class="lore">${human&&solo?'The world kneels. You raise the drowned isle of Thalmar from the sea and set the World Throne upon it, and you bind its stones with an oath: the land will stand for as long as one Lord rules it. Ages later, when the last High Lord drowns without an heir, the domains will fight over your throne.':'Thalmar rises from the sea, and the First Crown is set upon it. The oath is sworn: the land will stand for as long as one Lord rules it.'}</p>
   <p class="muted">${G.round} rounds · ${G.stats.battles} battles · ${G.stats.conquests} conquests · ${G.stats.trades} card trades</p>
   <div class="row"><button class="btn" data-a="menu">Title screen</button><button class="btn" data-a="look">Look at the world</button><button class="btn" data-a="lords">Play Lords &amp; Domains</button><button class="btn gold" data-a="again">Play again</button></div>`,m=>{
    m.querySelector('[data-a=menu]').onclick=()=>{UI.closeModal();stop();UI.showTitle()};
    m.querySelector('[data-a=look]').onclick=UI.closeModal;
    m.querySelector('[data-a=lords]').onclick=()=>{UI.closeModal();stop();UI.newLords()};
    m.querySelector('[data-a=again]').onclick=()=>{UI.closeModal();start(CC.seats.slice(0,CC.np))};
  });
  UI.store.set('crownSave',null);
  setBox(`<h3>The world is won</h3><p>${names} ${ws.length>1?'hold':'holds'} the First Crown.</p><div class="drow"><button class="btn gold" id="cAgain">Play again</button><button class="btn" id="cTitle">Title screen</button></div>`);
  $('#cAgain').onclick=()=>start(CC.seats.slice(0,CC.np));$('#cTitle').onclick=()=>{stop();UI.showTitle()};
}
// ---------- setup ----------
const CC=Object.assign({np:4,teams:0,victory:'world',deploy:'auto',seats:['human','normal','normal','normal','normal','normal']},UI.store.get('crownCfg',{}));
const PRESETS={
  classic:{name:'World war',blurb:'Four warlords, the whole world at stake.',np:4,teams:0,victory:'world',seats:['human','normal','normal','normal']},
  duel:{name:'Duel',blurb:'One against one for every continent.',np:2,teams:0,victory:'world',seats:['human','normal']},
  throne:{name:'Race for the Throne',blurb:'Hold Thalmar and two continents to win. Shorter and fierce.',np:4,teams:0,victory:'throne',seats:['human','normal','normal','normal']},
  six:{name:'Six warlords',blurb:'Every colour on the map.',np:6,teams:0,victory:'world',seats:['human','normal','normal','normal','normal','normal']},
  allies:{name:'Alliances',blurb:'Three against three. Allies cannot attack each other.',np:6,teams:2,victory:'world',seats:['human','normal','normal','normal','normal','normal']}};
const TEAM_OPTS=np=>[[0,'Every warlord for itself']].concat(np===4?[[2,'2 v 2']]:np===6?[[2,'3 v 3'],[3,'2 v 2 v 2']]:[]);
function setupModal(){
  const opts=[['human','Human'],['easy','Computer · Easy'],['normal','Computer · Normal'],['hard','Computer · Hard']];
  const c={...CC,seats:CC.seats.slice()};
  const draw=m=>{
    m.querySelector('#cnSeats').innerHTML=D.slice(0,c.np).map((d,p)=>`<div class="seat"><span class="sw" style="background:${TM[p].P}"></span><span>${d.name} <span class="muted" style="font-size:.8rem">· ${esc(d.host)}</span>${c.teams?` <span class="tm t${p%c.teams}">Team ${'ABC'[p%c.teams]}</span>`:''}</span><select data-seat="${p}">${opts.map(([v,l])=>`<option value="${v}" ${(c.seats[p]||'normal')===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('');
    m.querySelectorAll('[data-seat]').forEach(sl=>sl.onchange=()=>{c.seats[+sl.dataset.seat]=sl.value});
    const to=TEAM_OPTS(c.np);if(!to.some(t=>t[0]===c.teams))c.teams=0;
    m.querySelector('#cnTeams').innerHTML=to.map(([v,l])=>`<button data-v="${v}" class="${c.teams===v?'on':''}">${l}</button>`).join('');
    m.querySelectorAll('#cnNp button').forEach(b=>b.classList.toggle('on',+b.dataset.v===c.np));
    m.querySelectorAll('#cnVic button').forEach(b=>b.classList.toggle('on',b.dataset.v===c.victory));
    m.querySelectorAll('#cnDep button').forEach(b=>b.classList.toggle('on',b.dataset.v===c.deploy));
    m.querySelector('#cnVicTip').textContent=CW.VICTORY[c.victory].blurb;
  };
  UI.modal(`<h2>The First Crown · New game</h2>
   <p class="lore">Before the domains and before the oath, the world was a quarrel of realms. Whoever united it would raise the drowned isle of Thalmar from the sea and set the First Crown upon it.</p>
   <div class="pres">${Object.entries(PRESETS).map(([k,p])=>`<button class="pcard2" data-pre="${k}"><b>${p.name}</b><span>${p.blurb}</span></button>`).join('')}</div>
   <div class="ngrid">
    <div><h3 class="sec">Warlords</h3><span class="seg" id="cnNp">${[2,3,4,5,6].map(n=>`<button data-v="${n}">${n===2?'1 v 1':n}</button>`).join('')}</span></div>
    <div><h3 class="sec">Teams</h3><span class="seg" id="cnTeams"></span></div>
    <div><h3 class="sec">Victory</h3><span class="seg" id="cnVic">${Object.entries(CW.VICTORY).map(([k,v])=>`<button data-v="${k}">${v.name}</button>`).join('')}</span><p class="muted" id="cnVicTip" style="font-size:.82rem;margin:4px 0 0"></p></div>
    <div><h3 class="sec">Starting armies</h3><span class="seg" id="cnDep"><button data-v="auto">Placed for you</button><button data-v="manual">Place them yourself</button></span></div>
   </div>
   <h3 class="sec">Rulers</h3><div class="seats" id="cnSeats"></div>
   <div class="row"><button class="btn" data-x>Cancel</button><button class="btn gold" id="cnGo">March!</button></div>`,m=>{
    m.querySelector('[data-x]').onclick=UI.closeModal;
    m.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{const P=PRESETS[b.dataset.pre];Object.assign(c,{np:P.np,teams:P.teams,victory:P.victory,seats:P.seats.slice()});m.querySelectorAll('[data-pre]').forEach(x=>x.classList.toggle('on',x===b));draw(m);SND.play('select')});
    m.querySelector('#cnNp').onclick=e=>{const b=e.target.closest('button');if(!b)return;c.np=+b.dataset.v;while(c.seats.length<c.np)c.seats.push('normal');draw(m)};
    m.querySelector('#cnTeams').onclick=e=>{const b=e.target.closest('button');if(!b)return;c.teams=+b.dataset.v;draw(m)};
    m.querySelector('#cnVic').onclick=e=>{const b=e.target.closest('button');if(!b)return;c.victory=b.dataset.v;draw(m)};
    m.querySelector('#cnDep').onclick=e=>{const b=e.target.closest('button');if(!b)return;c.deploy=b.dataset.v;draw(m)};
    draw(m);
    m.querySelector('#cnGo').onclick=()=>{Object.assign(CC,c);UI.store.set('crownCfg',CC);UI.closeModal();start(c.seats.slice(0,c.np))};
  });
}
function enter(){
  active=true;RD.V.ext=frame;RD.V.title=false;V.title=false;$('#titleMenu').hidden=true;$('#diploBox').hidden=true;
  document.body.classList.add('crown');$('#bView').textContent='View: '+(V.mode==='field'?'Field':'Map');
}
function start(seats){
  token++;UI.leaveLords();SND.unlock();
  const ctrl=seats.map(s=>s==='human'?'human':'ai'),diff=seats.map(s=>s==='human'?'normal':s);
  G=CW.newGame({np:seats.length,ctrl,diff,teams:CC.teams,victory:CC.victory,deploy:CC.deploy});
  env=ENV.create('random');G.env=env;
  V.mode=S.crownView||'map';V.sel=null;V.targets=[];V.hover=-1;
  enter();
  $('#infoBox').innerHTML=`<h3>The world</h3><p class="muted">Hover over or tap a territory to read about it. Holding a whole continent earns its bonus every turn.</p>`;
  UI.store.set('crownSave',null);renderAll();music();
  loop(token);
}
function save(){if(G&&!G.over&&G.phase!=='deploy'){UI.store.set('crownSave',G)}}
function cont(){const g=UI.store.get('crownSave',null);if(!g)return;token++;UI.leaveLords();G=g;env=G.env||ENV.create('random');G.env=env;V.mode=S.crownView||'map';V.sel=null;V.targets=[];enter();renderAll();
  // resume at the start of the saved turn
  CW.beginTurn(G);loop(token)}
function stop(){token++;waiting=null;active=false;V.battle=null;if(RD.V.ext===frame||RD.V.ext===titleFrame)RD.V.ext=null;document.body.classList.remove('crown')}
// a world at war for the title screen
function titleFrame(t){frame(t)}
function titleDemo(){
  const np=3+Math.floor(Math.random()*4);
  G=CW.newGame({np,ctrl:Array(np).fill('ai')});for(let p=0;p<np;p++)CW.autoDeploy(G,p);CW.startPlay(G);
  const n=np*(2+Math.floor(Math.random()*6));for(let i=0;i<n&&!G.over;i++){CW.aiTurnSteps(G,G.turn);if(!G.over)CW.endTurn(G)}
  env=ENV.create('random');G.env=env;V.title=true;V.cam.want=Math.random()*Math.PI*2;V.sel=null;V.targets=[];V.hover=-1;RD.V.ext=titleFrame;renderAll();$('#log').innerHTML='';
}
function titleOff(){V.title=false;if(RD.V.ext===titleFrame)RD.V.ext=null}
// ---------- input ----------
function toInternal(e){const r=RD.cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
RD.cv.addEventListener('click',e=>{
  if(!active||V.title)return;e.stopImmediatePropagation();SND.unlock();
  if(V.battle){V.battle.skip=true;return}
  if(!waiting)return;const p=toInternal(e);waiting.click(pick(p.x,p.y));
},true);
RD.cv.addEventListener('mousemove',e=>{if(!active||V.title||V.battle)return;const p=toInternal(e);const id=pick(p.x,p.y);if(id!==V.hover){V.hover=id;if(id>=0)info(id)}},true);
RD.cv.addEventListener('mouseleave',()=>{if(active)V.hover=-1});
addEventListener('keydown',e=>{
  if(!active||!$('#modalBg').hidden||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const k=e.key.toLowerCase();
  if(k===' '&&V.battle){e.preventDefault();V.battle.skip=true;return}
  if(k==='escape'){V.sel=null;V.targets=[]}
  if(k==='h'&&G&&G.phase==='attack'&&hintFn&&waiting)hintFn();
  if(k==='enter'){const b=$('#turnBox .btn.gold');if(b&&!b.disabled){e.preventDefault();b.click()}}
},true);
function toggleView(){V.mode=V.mode==='field'?'map':'field';S.crownView=V.mode;UI.saveS();$('#bView').textContent='View: '+(V.mode==='field'?'Field':'Map')}
function rotate(d){V.cam.want+=d}
function zoom(k){V.cam.dist=Math.max(130,Math.min(300,V.cam.dist+k));V.cam.h=Math.max(60,Math.min(150,V.cam.h+k*.4))}
const RULES=`<h3>The First Crown</h3>
 <p>The prequel to Lords &amp; Domains. Before the domains and before the oath, warlords fought for the whole world. Whoever united it would raise the drowned isle of Thalmar and set the First Crown upon it.</p>
 <h3>The world</h3><ul><li>33 territories on seven continents: Nordhal, the Pearl Isles, Verdance, Emberreach, Sunmere, Ashkar, and Thalmar in the middle of the sea.</li><li>Dotted lines are sea lanes: territories joined by one border each other.</li><li>Hold a whole continent at the start of your turn to earn its bonus. Whoever holds <b>the Throne</b> earns one extra army.</li></ul>
 <h3>A turn</h3><ol><li><b>Reinforce.</b> You get a third of your territories (at least 3), plus continent bonuses, plus the Throne. Place them on your territories. Trade card sets for more.</li><li><b>Attack</b> as often as you like from any territory with 2 or more armies, using the Risk rules. You roll 1, 2 or 3 dice, and you need at least one more army than the dice you roll. The defender rolls 2 dice with two or more armies, or 1 die with one. The highest dice are compared in pairs: the higher wins each pair, <b>ties go to the defender</b>, and each lost pair costs that side one army. <b>Roll</b> rolls once; <b>Blitz</b> keeps rolling until the territory falls or you are down to one army. The odds are shown before you attack.</li><li>When a territory falls, march in as many armies as you like: anything from 1 to all but the one that must stay behind.</li><li><b>Fortify:</b> one march along a chain of your own territories, then your turn ends.</li></ol>
 <h3>Cards</h3><ul><li>Take at least one territory in a turn and you earn a card: Footman ⚔, Rider 🐎, Siege 🏹 or Wild ★.</li><li>Trade three of a kind, one of each, or any two with a wild, for 4, 6, 8, 10, 12, 15 armies, then 5 more each time. A card showing a territory you hold adds 2 armies there.</li><li>With five cards you must trade. Drive a warlord out and you take their cards.</li></ul>
 <h3>Winning</h3><ul><li><b>World conquest:</b> take every territory.</li><li><b>The Throne:</b> hold all of Thalmar and any two other continents at the start of your turn.</li><li><b>Dominion:</b> hold 21 of the 33 territories at the start of your turn.</li><li>With teams, allies cannot attack each other and win together.</li></ul>
 <h3>Fair play</h3><ul><li>The first round is a truce, so moving first is no great edge. Later seats start with a few extra armies.</li></ul>
 <h3>Controls</h3><ul><li>Click your territories to place armies (choose +1, +3, +5 or All). Click an attacker, then a red-framed target; click the target again to roll. Enter presses the gold button. V switches between the map and the field view.</li></ul>`;
return {start,setupModal,cont,stop,titleDemo,titleOff,toggleView,rotate,zoom,get active(){return active},get G(){return G},V,RULES,hasSave:()=>!!UI.store.get('crownSave',null)};
})();
window.CR=CR;

</script>
</body>
</html>
