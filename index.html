<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lords & Domains: a five-player hidden-Lord strategy game with alliances, bluffs and betrayals.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<title>Lords &amp; Domains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#d9d5e6;--ink:#1b1830;--muted:#55506e;--win-a:#3048b8;--win-b:#101c58;--win-ink:#ffffff;--win-muted:#b8c0f0;--edge:#f0f0ff;--edge2:#8890c0;
  --gold:#ffe070;--bad:#ff7070;--ok:#8ce07c;--btn:#2a3a9c;--btn-hi:#4058d0;--shadow:0 6px 0 rgba(0,0,0,.25);
  --font:"Pixelify Sans",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0b0d22;--ink:#e8e6f6;--muted:#a09cc0}}
:root[data-theme="dark"]{--page:#0b0d22;--ink:#e8e6f6;--muted:#a09cc0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px}
body{min-height:100vh;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
button,select,input{font:inherit}
[hidden]{display:none!important}
.app{max-width:1280px;margin:0 auto;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.35rem;letter-spacing:.04em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--gold);box-shadow:3px 3px 0 #c08020;transform:rotate(45deg)}
.btn{background:linear-gradient(#4a60d8,#24308c);color:#fff;border:2px solid var(--edge);border-radius:6px;padding:6px 12px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);text-shadow:1px 1px 0 #000;min-height:36px}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.gold{background:linear-gradient(#ffd860,#c08018);color:#2a1800;text-shadow:none;border-color:#fff4c0}
.btn.red{background:linear-gradient(#e05050,#8c1c24)}
.btn.sm{padding:3px 8px;min-height:30px;font-size:.9rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;align-items:start}
.stage{position:relative;display:grid;gap:8px}
.screenwrap{position:relative;background:#000;border:3px solid var(--edge);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;aspect-ratio:384/240}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctrls .sp{flex:1}
.win{background:linear-gradient(var(--win-a),var(--win-b));color:var(--win-ink);border:3px solid var(--edge);border-radius:8px;box-shadow:inset 0 0 0 1px var(--edge2),var(--shadow);padding:10px 12px}
.win h3{margin:0 0 6px;font-size:1rem;color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
.win p{margin:4px 0;line-height:1.35}
.muted{color:var(--win-muted)}
.side{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.18)}
.dom:last-child{border-bottom:0}
.dom .sw{width:14px;height:14px;border:2px solid #fff;border-radius:3px;grid-row:span 2}
.dom b{font-weight:700}
.dom .meta{font-size:.82rem;color:var(--win-muted);grid-column:2/4}
.dom.dead{opacity:.45}.dom.dead b{text-decoration:line-through}
.dom.turn b::after{content:" ◄";color:var(--gold)}
.chips{display:inline-flex;gap:2px;flex-wrap:wrap}
.chip{display:inline-block;min-width:16px;text-align:center;font-size:.75rem;padding:0 3px;border-radius:3px;background:rgba(255,255,255,.15)}
.chip.l{background:var(--gold);color:#2a1800}
.att{font-size:.78rem;padding:1px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}
.att.Allied{background:#2c8c3c}.att.Friendly{background:#3c7c5c}.att.Hostile{background:#9c2c2c}.att.Wary{background:#8c6c1c}
.drow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.drow select{background:#101c58;color:#fff;border:2px solid var(--edge2);border-radius:6px;padding:4px 6px;min-height:34px}
#log{max-height:220px;overflow:auto;font-size:.88rem;line-height:1.35;display:grid;gap:3px}
#log div{padding-left:8px;border-left:4px solid transparent}
.info{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.info canvas{width:48px;height:72px;image-rendering:pixelated;background:rgba(0,0,0,.25);border-radius:4px}
.bars{display:grid;gap:2px;margin-top:4px;font-size:.8rem}
.bar{display:grid;grid-template-columns:62px 1fr 34px;gap:6px;align-items:center}
.bar i{display:block;height:7px;background:var(--gold);border-radius:2px}
.modal-bg{position:fixed;inset:0;background:rgba(4,6,24,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{max-width:640px;width:100%;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 8px;color:var(--gold);font-size:1.4rem}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.seats{display:grid;gap:6px;margin:8px 0}
.seat{display:grid;grid-template-columns:20px 1fr 170px;gap:8px;align-items:center}
.seat select{background:#101c58;color:#fff;border:2px solid var(--edge2);border-radius:6px;padding:4px;min-height:34px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.rules h3{color:var(--gold);margin:12px 0 4px}
.rules ul{margin:4px 0;padding-left:18px;line-height:1.45}
.rtbl{display:grid;grid-template-columns:36px 1fr;gap:6px 10px;align-items:center}
.rtbl img{width:32px;height:48px;image-rendering:pixelated}
.toast{position:absolute;left:50%;top:26px;transform:translateX(-50%);max-width:90%;z-index:5;pointer-events:none;font-size:.95rem;text-align:center}
.titlemenu{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:4}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.18)}
.seg{display:inline-flex;border:2px solid var(--edge2);border-radius:6px;overflow:hidden}
.seg button{background:#101c58;color:#fff;border:0;padding:4px 10px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--gold);color:#2a1800}
.kbd{font-size:.8rem;color:var(--win-muted)}
.corner{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:80;display:flex;gap:6px}
.corner .nowplay{align-self:center;font-size:.8rem;color:#fff;background:rgba(10,14,50,.82);border:2px solid var(--edge2);border-radius:6px;padding:3px 8px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.corner button.nowplay{cursor:pointer;font:inherit}
.corner button.nowplay:hover{border-color:var(--gold)}
.songs{display:grid;gap:6px;margin:8px 0}
.songs .btn{text-align:left}
.bsels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.bsel{display:grid;gap:3px;font-size:.84rem;color:var(--win-muted)}
.bsel select{background:#101c58;color:#fff;border:2px solid var(--edge2);border-radius:6px;padding:4px;min-height:34px;width:100%}
@media (max-width:560px){.bsels{grid-template-columns:1fr}}
.corner .btn{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.3)}
.coach{border-color:var(--gold);box-shadow:inset 0 0 0 1px #c08020,var(--shadow)}
.coach .cstep{font-size:.8rem;color:var(--win-muted);letter-spacing:.06em;text-transform:uppercase}
.modes2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{display:grid;gap:4px;padding:10px;border:2px solid var(--edge2);border-radius:8px;cursor:pointer;background:rgba(0,0,0,.18)}
.mcard:has(input:checked){border-color:var(--gold);background:rgba(255,224,112,.12)}
.mcard input{accent-color:#ffd860;width:18px;height:18px}
.mcard span{font-size:.86rem;color:var(--win-muted);line-height:1.3}
@media (max-width:560px){.modes2{grid-template-columns:1fr}}
body{padding-bottom:64px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.brand{font-size:1.1rem}}
@media (max-width:520px){.titlemenu{bottom:10px}.titlemenu .btn{padding:4px 8px;min-height:32px;font-size:.85rem}.seat{grid-template-columns:20px 1fr 130px}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand"><i></i>Lords &amp; Domains</div>
    <button class="btn sm" id="bView" title="Switch between the field and the map (V)">View: Map</button>
    <button class="btn sm" id="bRotL" title="Rotate left (Q)" aria-label="Rotate left">⟲</button>
    <button class="btn sm" id="bRotR" title="Rotate right (E)" aria-label="Rotate right">⟳</button>
    <button class="btn sm" id="bZoomIn" title="Closer (+)" aria-label="Zoom in">＋</button>
    <button class="btn sm" id="bZoomOut" title="Further (-)" aria-label="Zoom out">－</button>
    <button class="btn sm" id="bRules">Rules</button>
    <button class="btn sm" id="bSettings">Settings</button>
    <button class="btn sm" id="bMenu">Menu</button>
  </div>
  <div class="layout">
    <div class="stage">
      <div class="screenwrap"><canvas id="screen"></canvas>
        <div class="win toast" id="toast" hidden></div>
        <div class="titlemenu" id="titleMenu">
          <button class="btn gold" id="tNew">New game</button>
          <button class="btn" id="tCont" hidden>Continue</button>
          <button class="btn" id="tWalk">Walkthrough</button>
          <button class="btn" id="tRules">How to play</button>
          <button class="btn" id="tSet">Settings</button>
        </div>
      </div>
      <div class="win coach" id="coach" hidden></div>
      <div class="win" id="turnBox"><h3>Welcome</h3><p>Six domains. Six hidden Lords. Press <b>New game</b> to begin.</p></div>
    </div>
    <div class="side">
      <div class="win" id="infoBox"><h3>Inspect</h3><p class="muted">Hover over or tap a piece to read about it.</p></div>
      <div class="win" id="domBox"><h3>Domains</h3><div id="doms"></div></div>
      <div class="win" id="diploBox" hidden><h3>Diplomacy</h3><div id="diplo"></div></div>
      <div class="win"><h3>Chronicle</h3><div id="log"></div></div>
    </div>
  </div>
</div>
<div class="corner" id="corner" aria-label="Sound and music"></div>
<div class="modal-bg" id="modalBg" hidden><div class="win modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
// ===================== Lords & Domains: rules, diplomacy and AI =====================
// Pure game logic. No DOM. The same code runs in the page and in tests.
const LD=(()=>{
// ---------- the board: a six-sided field of six-sided hexes ----------
// Pointy-top hexes in axial coordinates, every hex within HR steps of the centre. Each tile is stored by id, and
// (r,c) = (floor(id/N), id%N) so the rest of the code can keep using r,c.
const NP=6;                       // six domains, one on each side
const ALLP=[0,1,2,3,4,5];
const TILE=16,HR=9,SQ3=Math.sqrt(3);
const BR=HR+.62;                  // board outline radius, in hex units, just outside the corner hexes
// outline: a flat-topped hexagon, flat side at the bottom
const PENT=[0,1,2,3,4,5].map(k=>{const a=k*Math.PI/3;return{x:BR*SQ3*Math.cos(a),y:BR*SQ3*Math.sin(a)}});
const PENT_R=BR*SQ3;
function inPent(x,y){const n=PENT.length;for(let k=0;k<n;k++){const a=PENT[k],b=PENT[(k+1)%n];if((b.x-a.x)*(y-a.y)-(b.y-a.y)*(x-a.x)<0)return false}return true}
const ALLT=[];
for(let r=-HR;r<=HR;r++)for(let q=-HR;q<=HR;q++){if(Math.abs(q)>HR||Math.abs(r)>HR||Math.abs(q+r)>HR)continue;
  const x=SQ3*(q+r/2),y=1.5*r;const poly=[0,1,2,3,4,5].map(k=>{const a=Math.PI/6+k*Math.PI/3;return{x:x+Math.cos(a),y:y+Math.sin(a)}});
  ALLT.push({q,r,x,y,poly,nb:[]})}
{const idx={};ALLT.forEach((t,i)=>idx[t.q+','+t.r]=i);
 for(const t of ALLT)for(const [dq,dr] of [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]]){const j=idx[(t.q+dq)+','+(t.r+dr)];if(j!=null)t.nb.push(j)}}
const KEEP=ALLT.map((t,i)=>i);
const N=Math.ceil(Math.sqrt(KEEP.length))+1,M=0;
const TID={};KEEP.forEach((ti,k)=>TID[ti]=k);
const TILES=KEEP.map((ti,k)=>({id:k,x:ALLT[ti].x,y:ALLT[ti].y,poly:ALLT[ti].poly,nb:ALLT[ti].nb.filter(n=>TID[n]!=null).map(n=>TID[n])}));
const VALID=new Set(),CELLS=[];
TILES.forEach(t=>{const r=Math.floor(t.id/N),c=t.id%N;t.r=r;t.c=c;VALID.add(r*N+c);CELLS.push([r,c])});
const tileOf=(r,c)=>TILES[r*N+c];
const cellXY=(r,c)=>{const t=TILES[r*N+c];return t?{x:t.x,y:t.y}:{x:0,y:0}};
// neighbours of a tile, as [r,c]
const NB=TILES.map(t=>t.nb.map(n=>[TILES[n].r,TILES[n].c]));
const nbrs=(r,c)=>NB[r*N+c]||[];
const DIRS=null,DIAGS=[];
// shortest walking distance between any two tiles (ignoring water), for the computer rulers' planning
const DIST=(()=>{const n=TILES.length,D=new Array(n);for(let s=0;s<n;s++){const d=new Int16Array(n).fill(99);d[s]=0;const q=[s];for(let h=0;h<q.length;h++)for(const m of TILES[q[h]].nb)if(d[m]>d[q[h]]+1){d[m]=d[q[h]]+1;q.push(m)}D[s]=d}return D})();
const hexDist=(r1,c1,r2,c2)=>{const a=TILES[r1*N+c1],b=TILES[r2*N+c2];return a&&b?DIST[a.id][b.id]:99};
// Scouts run "straight": through each tile they keep to the neighbour most in line with where they started heading
const RAYS=TILES.map(t=>t.nb.map(n0=>{const ray=[n0];const dx=TILES[n0].x-t.x,dy=TILES[n0].y-t.y,L=Math.hypot(dx,dy);let prev=t.id,cur=n0;
  for(let k=0;k<30;k++){let best=-1,bd=.72;for(const m of TILES[cur].nb){if(m===prev||ray.includes(m)||m===t.id)continue;const ex=TILES[m].x-TILES[cur].x,ey=TILES[m].y-TILES[cur].y;const dot=(ex*dx+ey*dy)/(Math.hypot(ex,ey)*L);if(dot>bd){bd=dot;best=m}}
    if(best<0)break;ray.push(best);prev=cur;cur=best}
  return ray}));
// where along which ray from tile a does tile b sit?
const RAYAT=TILES.map((t,i)=>{const m={};RAYS[i].forEach((ray,ri)=>ray.forEach((b,k)=>{if(m[b]==null)m[b]={ri,k:k+1}}));return m});
const angled=()=>false;
const rescueNbrs=(r,c)=>nbrs(r,c);
function stepFor(dr,dc){return null}
const inLine=()=>false;
const RANK_NAME={9:'Lord',8:'Marshal',7:'Knight',6:'Captain',5:'Guard',4:'Raider',3:'Scout',2:'Spy',1:'Sapper',0:'Keep'};
const RANK_SHORT={9:'L',8:'8',7:'7',6:'6',5:'5',4:'4',3:'3',2:'2',1:'1',0:'K'};
const RANK_TIP={
 9:'Your ruler and your strongest piece. It beats every rank, and a Lord who strikes first wins against another Lord or a Spy. A Spy that strikes first kills it. Attacking a Keep destroys it. If it falls, your whole domain falls.',
 8:'The strongest fighter. Loses only to the Lord, a Keep, or another Marshal (both fall).',
 7:'Heavy cavalry. Beats every rank below 7.',
 6:'A veteran officer. Beats every rank below 6.',
 5:'Steady infantry. Beats every rank below 5.',
 4:'A fast striker. Beats every rank below 4.',
 3:'Runs any number of open spaces in a straight line, in any of the six directions. Every domain has four. Good for probing unknown pieces.',
 2:'Weak in a fair fight, but a Spy that strikes a Lord first kills it. Every domain has two.',
 1:'The only piece that can break a Keep, and breaking a Keep topples that whole domain.',
 0:'Your fortress. It never moves. Anything that attacks it is destroyed, except a Sapper. If a Sapper breaks it, your whole domain falls.'};
const VALUE={9:40,8:9,7:7,6:5.5,5:4,4:3.2,3:2.6,2:3.4,1:3,0:2.2};
const ARMY=[9,8,7,6,5,4,3,3,3,3,2,2,1,0];
const countOf=k=>ARMY.filter(x=>x===k).length;
const DOMAINS=[
 {name:'Crimson',banner:'the Ember Crown'},
 {name:'Azure',banner:'the Tide Throne'},
 {name:'Verdant',banner:'the Greenwood Seat'},
 {name:'Golden',banner:'the Sun Court'},
 {name:'Violet',banner:'the Dusk Spire'},
 {name:'Teal',banner:'the Reef Hall'}];
// Five homes roughly evenly spaced around the board. Each: 3x3 block on the edge + two forward squares.
// each domain holds one side of the pentagon: a strip two spaces deep along the middle of its edge
const SIDES=PENT.map((_,k)=>{const n=PENT.length,a=PENT[(k+n-1)%n],b=PENT[k];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const L=Math.hypot(mx,my);return{mx,my,nx:mx/L,ny:my/L,tx:(b.x-a.x)/Math.hypot(b.x-a.x,b.y-a.y),ty:(b.y-a.y)/Math.hypot(b.x-a.x,b.y-a.y),L}});
// side 0 is the bottom edge (Crimson), then round the field
const SIDE_OF=(()=>{const order=[];for(let k=0;k<NP;k++){const S=SIDES[k];order.push({k,ang:Math.atan2(S.my,S.mx)})}const bottom=order.reduce((a,b)=>Math.abs(b.ang-Math.PI/2)<Math.abs(a.ang-Math.PI/2)?b:a).k;return ALLP.map(i=>(bottom+i)%NP)})();
const HOMES=ALLP.map(p=>{const S=SIDES[SIDE_OF[p]];
  // two rows along the edge: the seven most central hexes of the outer row and of the row behind it
  const info=CELLS.map(([r,c])=>{const q=cellXY(r,c);return{r,c,depth:S.L-(q.x*S.nx+q.y*S.ny),lat:q.x*S.tx+q.y*S.ty}});
  const d0=Math.min(...info.map(o=>o.depth));
  const row=k=>info.filter(o=>Math.abs(o.depth-(d0+1.5*k))<.4).sort((a,b)=>Math.abs(a.lat)-Math.abs(b.lat)||a.lat-b.lat).slice(0,7);
  return row(0).concat(row(1)).map(o=>[o.r,o.c,S])});
function homeCells(p){
  // back to front: the spaces nearest the edge come first, the middle of the line before the flanks
  return HOMES[p].map(([r,c,S])=>{const q=cellXY(r,c);return{r,c,depth:S.L-(q.x*S.nx+q.y*S.ny),lat:Math.abs(q.x*S.tx+q.y*S.ty)}}).sort((a,b)=>a.depth-b.depth||a.lat-b.lat).map(o=>[o.r,o.c]);
}
// lakes: one in the middle and five between the domains
const WATER=(()=>{const w=new Set();const near=(x,y)=>CELLS.slice().sort((a,b)=>{const pa=cellXY(a[0],a[1]),pb=cellXY(b[0],b[1]);return Math.hypot(pa.x-x,pa.y-y)-Math.hypot(pb.x-x,pb.y-y)});
  const home=new Set(HOMES.flat().map(([r,c])=>r+','+c));
  for(const k of [...home]){const [r,c]=k.split(',').map(Number);for(const [rr,cc] of nbrs(r,c))home.add(rr+','+cc)}
  const c0=near(0,0)[0];w.add(c0[0]+','+c0[1]);
  for(let k=0;k<NP;k++){const v=PENT[k];const x=v.x*.5,y=v.y*.5;for(const cc of near(x,y).filter(q=>!home.has(q[0]+','+q[1])).slice(0,2))w.add(cc[0]+','+cc[1])}
  return w})();
const isWater=(r,c)=>WATER.has(r+','+c);
// lakes, plus (in Decisive mode) squares the sea has swallowed or the seabed has filled
let CURG=null;
const blocked=(r,c,G)=>{G=G||CURG;const t=G&&G.sunk&&G.sunk[r+','+c];return t==='sea'||(t!=='land'&&WATER.has(r+','+c))};
const inB=(r,c)=>r>=0&&c>=0&&r<N&&c<N&&VALID.has(r*N+c);
const PERSONAS=[
 {name:'Honourable',honor:.9,greed:.3,deceit:.1,aggr:.5,blurb:'keeps its word, mostly'},
 {name:'Opportunist',honor:.4,greed:.8,deceit:.5,aggr:.6,blurb:'goes where the gold is'},
 {name:'Warlike',honor:.5,greed:.6,deceit:.2,aggr:.95,blurb:'would rather fight than talk'},
 {name:'Schemer',honor:.25,greed:.6,deceit:.9,aggr:.5,blurb:'loves a rumour'},
 {name:'Cautious',honor:.75,greed:.35,deceit:.3,aggr:.3,blurb:'guards its walls'},
 {name:'Hunter',honor:.55,greed:.7,deceit:.35,aggr:.8,blurb:'stalks Lords'}];
const DIFF={chaos:{noise:40,look:0,aggr:1},easy:{noise:3.2,look:.4,aggr:1.15},normal:{noise:1.1,look:.8,aggr:.8},hard:{noise:.35,look:1,aggr:.4}};
const PACT_LEN=6;

let rnd=Math.random;
const setRandom=f=>{rnd=f};
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- new game ----------
function newGame(opts){
  const ctrl=opts.ctrl||['human','ai','ai','ai','ai'];
  const diff=opts.diff||ALLP.map(()=>'normal');
  const personas=shuffle(PERSONAS.slice());
  const G={v:2,n:N,round:1,turn:0,phase:'setup',ctrl,diff,pieces:[],alive:ALLP.map(()=>true),
    persona:personas.map(p=>p.name),trust:ALLP.map(()=>Array(NP).fill(50)),pacts:ALLP.map(()=>Array(NP).fill(0)),
    rep:Array(NP).fill(0),accused:Array(NP).fill(0),grudge:ALLP.map(()=>Array(NP).fill(0)),kills:Array(NP).fill(0),
    offers:[],log:[],lastCapture:1,over:false,winner:null,fallenBy:Array(NP).fill(null),actedDiplo:false,
    stats:{clashes:0,betrayals:0},ready:Array(NP).fill(false),decisive:!!opts.decisive,sunk:{},quakes:0,lastQuake:null};
  for(let p=0;p<NP;p++){
    const cells=homeCells(p);
    const ranks=ctrl[p]==='ai'?aiSetup():shuffle(ARMY.slice());
    cells.forEach(([r,c],i)=>G.pieces.push({id:G.pieces.length,p,rank:ranks[i],r,c,alive:true,moves:0,revealed:false,known:[],rumor:false,prev:null,lastMoved:0}));
  }
  addLog(G,'The six domains take the field. Each Lord is hidden among its own.');
  return G;
}
// AI setup: Lord in the back, a Keep beside it, Spy and Scouts forward.
function aiSetup(){
  const order=[9,0,5,8,1,6,7,4,2,2,3,3,3,3]; // index 0 = back row middle; the last few are the front line
  const r=order.slice();
  // a little variety so the Lord is not always in the same corner
  if(rnd()<.5){[r[0],r[2]]=[r[2],r[0]]}
  if(rnd()<.35){[r[0],r[3]]=[r[3],r[0]]}
  if(rnd()<.5){[r[4],r[6]]=[r[6],r[4]]}
  if(rnd()<.5){[r[7],r[9]]=[r[9],r[7]]}
  if(rnd()<.5){[r[8],r[9]]=[r[9],r[8]]}
  return r;
}
function addLog(G,t,p){G.log.push({t,p:p==null?-1:p,round:G.round});if(G.log.length>200)G.log.shift()}
const at=(G,r,c)=>G.pieces.find(x=>x.alive&&x.r===r&&x.c===c)||null;
const alivePieces=(G,p)=>G.pieces.filter(x=>x.alive&&x.p===p);
const lordOf=(G,p)=>G.pieces.find(x=>x.alive&&x.p===p&&x.rank===9);

// ---------- setup ----------
function swapSetup(G,a,b){const A=G.pieces[a],B=G.pieces[b];if(!A||!B||A.p!==B.p)return;[A.rank,B.rank]=[B.rank,A.rank]}
function shuffleSetup(G,p){const ps=alivePieces(G,p);const rs=shuffle(ps.map(x=>x.rank));ps.forEach((x,i)=>x.rank=rs[i])}
function suggestSetup(G,p){const cells=homeCells(p);const rs=aiSetup();cells.forEach(([r,c],i)=>{at(G,r,c).rank=rs[i]})}
function startPlay(G){G.phase='play';G.turn=0;while(!G.alive[G.turn])G.turn=(G.turn+1)%NP;addLog(G,'Battle begins. '+DOMAINS[G.turn].name+' moves first.')}

// ---------- movement ----------
function movesFor(G,x){
  if(!x||!x.alive||x.rank===0)return[];
  const out=[];const t=tileOf(x.r,x.c);
  const paths=x.rank===3?RAYS[t.id]:t.nb.map(n=>[n]);
  for(const path of paths){
    for(const id of path){
      const r=TILES[id].r,c=TILES[id].c;
      if(blocked(r,c,G))break;
      const q=at(G,r,c);
      if(!q){out.push({r,c,attack:false});continue}
      if(q.p!==x.p)out.push({r,c,attack:true,target:q.id});
      break;
    }
  }
  return out;
}
function allMoves(G,p){const o=[];for(const x of alivePieces(G,p))for(const m of movesFor(G,x))o.push({id:x.id,...m});return o}
// combat: 1 attacker wins, -1 defender wins, 0 both fall
function resolve(a,d){
  if(d===0)return a===1?1:-1;          // Keep: only a Sapper breaks it
  if(a===2&&d===9)return 1;            // a Spy kills a Lord whenever they meet
  if(a===9&&d===9)return 1;            // a Lord who strikes first wins the duel
  if(a>d)return 1; if(a<d)return -1; return 0;
}
const hasPact=(G,a,b)=>a!==b&&G.pacts[a][b]>=G.round;
// Perform a move. Returns a list of events for the renderer.
function doMove(G,id,r,c){
  const x=G.pieces[id];const ev=[];
  const t=at(G,r,c);
  const from={r:x.r,c:x.c};
  x.prev=from;x.moves++;x.lastMoved=G.round;
  if(!t){x.r=r;x.c=c;ev.push({type:'move',id,from,to:{r,c}});}
  else{
    G.stats.clashes++;
    const betray=hasPact(G,x.p,t.p);
    if(betray)breakPact(G,x.p,t.p,ev);
    const res=resolve(x.rank,t.rank);
    // grudges and trust
    G.grudge[t.p][x.p]+=1.2;G.trust[t.p][x.p]=clamp(G.trust[t.p][x.p]-12,0,100);
    x.revealed=true;t.revealed=true;
    const e={type:'clash',att:id,def:t.id,from,to:{r,c},result:res,aRank:x.rank,dRank:t.rank,ap:x.p,dp:t.p};
    ev.push(e);
    const nm=(q)=>`${DOMAINS[q.p].name} ${RANK_NAME[q.rank]}`;
    let line=`${nm(x)} attacks ${nm(t)}. `;
    if(res>0){t.alive=false;x.r=r;x.c=c;G.kills[x.p]++;
      line+=t.rank===0?'The Sapper breaks the Keep!':x.rank===2&&t.rank===9?'The Spy strikes down the Lord!':`${DOMAINS[x.p].name} wins.`}
    else if(res<0){x.alive=false;G.kills[t.p]++;line+=t.rank===0?'The Keep holds. The attacker is destroyed.':`${DOMAINS[t.p].name} holds.`}
    else{x.alive=false;t.alive=false;line+='Both fall.'}
    addLog(G,line,x.p);G.lastCapture=G.round;
    // a fallen Lord takes the domain with it
    for(const q of [t,x])if(!q.alive&&q.rank===9&&G.alive[q.p]){fallDomain(G,q.p,q===t?x.p:t.p,ev)}
    // a broken Keep topples its domain too
    if(res>0&&t.rank===0&&G.alive[t.p])fallDomain(G,t.p,x.p,ev,'keep');
  }
  return ev;
}
function fallDomain(G,p,by,ev,how){
  G.alive[p]=false;G.fallenBy[p]=by;
  for(const q of G.pieces)if(q.p===p&&q.alive){q.alive=false;q.revealed=true}
  for(let b=0;b<NP;b++){G.pacts[p][b]=0;G.pacts[b][p]=0}
  addLog(G,how==='keep'?`The Keep of ${DOMAINS[p].name} is breached${by!=null?' by '+DOMAINS[by].name:''}. The domain collapses.`:`The Lord of ${DOMAINS[p].name} has fallen${by!=null&&by!==p?' to '+DOMAINS[by].name:''}. The domain collapses.`,p);
  ev.push({type:'fall',p,by,how:how||'lord'});
}
function breakPact(G,a,b,ev){
  G.pacts[a][b]=0;G.pacts[b][a]=0;G.rep[a]++;G.stats.betrayals++;
  G.trust[b][a]=0;G.grudge[b][a]+=3;
  for(let o=0;o<NP;o++)if(o!==a&&o!==b)G.trust[o][a]=clamp(G.trust[o][a]-12,0,100);
  addLog(G,`${DOMAINS[a].name} breaks its pact with ${DOMAINS[b].name}!`,a);
  ev&&ev.push({type:'betray',a,b});
}
function nextTurn(G){
  const al=G.alive.filter(Boolean).length;
  if(al<=1){G.over=true;G.winner=G.alive.indexOf(true);addLog(G,`${DOMAINS[G.winner].name} claims every domain.`,G.winner);return}
  // stalemate: long quiet stretch or round limit
  // in Decisive mode the quiet clock only runs once the island has stopped sinking
  const quietFrom=G.decisive?Math.max(G.lastCapture,G.islandDone?G.doneSince:G.round):G.lastCapture;
  if(G.round-quietFrom>=(G.decisive?25:40)||G.round>=200){
    let best=-1,bv=-1;for(let p=0;p<NP;p++)if(G.alive[p]){const v=alivePieces(G,p).reduce((s,x)=>s+(x.rank===9?0:VALUE[x.rank]),0);if(v>bv){bv=v;best=p}}
    G.over=true;G.winner=best;G.stalemate=true;addLog(G,`The war grinds to a halt. ${DOMAINS[best].name} holds the strongest army and is named High Lord.`,best);return;
  }
  let t=G.turn;
  do{t=(t+1)%NP;if(t===0)endRound(G)}while(!G.alive[t]);
  G.turn=t;G.actedDiplo=false;
  if(!allMoves(G,t).length){addLog(G,`${DOMAINS[t].name} cannot move.`,t);return nextTurn(G)}
}
function endRound(G){
  G.round++;
  quake(G);
  for(let p=0;p<NP;p++){G.accused[p]=Math.max(0,G.accused[p]-.12);for(let q=0;q<NP;q++)G.grudge[p][q]*=.93}
  for(let a=0;a<NP;a++)for(let b=a+1;b<NP;b++)if(G.pacts[a][b]&&G.pacts[a][b]===G.round-1){
    G.pacts[a][b]=G.pacts[b][a]=0;G.trust[a][b]=clamp(G.trust[a][b]+10,0,100);G.trust[b][a]=clamp(G.trust[b][a]+10,0,100);
    if(G.alive[a]&&G.alive[b])addLog(G,`The pact between ${DOMAINS[a].name} and ${DOMAINS[b].name} ends honourably.`);
  }
}

// ---------- Decisive mode: the restless island ----------
// From round QUAKE_START the island reshapes itself every round. Empty, out-of-the-way land sinks into the sea and
// seabed rises elsewhere as new land. The island is neutral: it treats every pair of rival domains the same and only
// wants the war to finish, so it raises land that shortens the routes between rivals and sinks the places armies
// could hide. It never sinks an occupied square or cuts any piece off; once nothing more can go, it only keeps the
// roads between the Lords. It sinks a little more than it raises, so the island slowly shrinks.
const QUAKE_START=6;
function landConnected(G,skip,lordsOnly){
  const alive=G.pieces.filter(x=>x.alive&&(!lordsOnly||x.rank===9));if(alive.length<2)return true;
  const seen=new Set([alive[0].r+','+alive[0].c]);const st=[[alive[0].r,alive[0].c]];
  while(st.length){const [r,c]=st.pop();for(const [rr,cc] of nbrs(r,c)){const k=rr+','+cc;if(!inB(rr,cc)||seen.has(k)||k===skip||blocked(rr,cc,G))continue;seen.add(k);st.push([rr,cc])}}
  return alive.every(x=>seen.has(x.r+','+x.c));
}
// breadth-first distances over land from a set of start squares
function bfs(G,starts){
  const d=new Array(N*N).fill(999);const q=[];
  for(const [r,c] of starts){d[r*N+c]=0;q.push(r*N+c)}
  for(let h=0;h<q.length;h++){const i=q[h],r=(i/N)|0,c=i%N;for(const [rr,cc] of nbrs(r,c)){if(!inB(rr,cc)||blocked(rr,cc,G))continue;const j=rr*N+cc;if(d[j]>d[i]+1){d[j]=d[i]+1;q.push(j)}}}
  return d;
}
// how far apart the rival armies are: for every pair of living domains, the shortest route between them
function separation(G){
  const al=ALLP.filter(p=>G.alive[p]);const ds={};
  for(const p of al)ds[p]=bfs(G,alivePieces(G,p).map(x=>[x.r,x.c]));
  let F=0;for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j];let m=999;for(const x of alivePieces(G,b))m=Math.min(m,ds[a][x.r*N+x.c]);F+=Math.min(m,60)}
  return F;
}
// would sinking (r,c) leave a neighbouring piece with no open land beside it at all?
function boxesIn(G,r,c){
  for(const [nr,nc] of nbrs(r,c)){const q=at(G,nr,nc);if(!q||q.rank===0)continue;
    let open=0;for(const [rr,cc] of nbrs(q.r,q.c)){if((rr===r&&cc===c)||!inB(rr,cc)||blocked(rr,cc,G))continue;if(!at(G,rr,cc)||at(G,rr,cc).p!==q.p)open++}
    if(open===0)return true}
  return false;
}
// raise a bridge for any piece the sea has cut off (older saves, or a domain hemmed in by its own pieces)
function rescue(G,tiles){
  if(landConnected(G,null,false))return;
  const pcs=G.pieces.filter(x=>x.alive);const main=bfs(G,[[pcs[0].r,pcs[0].c]]);
  for(const x of pcs){if(main[x.r*N+x.c]<999)continue;
    // walk from the stranded piece toward the main body, raising seabed as we go
    let r=x.r,c=x.c;for(let k=0;k<26;k++){let best=null,bd=1e9;for(const [rr,cc] of rescueNbrs(r,c)){const d=Math.min(...pcs.filter(q=>main[q.r*N+q.c]<999).map(q=>hexDist(q.r,q.c,rr,cc)));if(d<bd){bd=d;best=[rr,cc]}}
      if(!best)break;[r,c]=best;if(blocked(r,c,G)){G.sunk[r+','+c]='land';tiles.push({r,c,kind:'rise'})}if(main[r*N+c]<999)break}
  }
}
const occOf=(G,r,c)=>G.pieces.some(x=>x.alive&&x.r===r&&x.c===c);
// raise a line of seabed along the straightest route between the two closest rival armies
function landDistFrom(G,r,c){const D=new Int32Array(TILES.length).fill(-1);const s=tileOf(r,c).id;D[s]=0;const q=[s];
  for(let h=0;h<q.length;h++)for(const m of TILES[q[h]].nb){if(D[m]>=0)continue;const T=TILES[m];if(blocked(T.r,T.c,G))continue;D[m]=D[q[h]]+1;q.push(m)}return D}
function causeway(G){
  const al=ALLP.filter(p=>G.alive[p]);let best=null;
  for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j];if(hasPact(G,a,b))continue;
    for(const x of alivePieces(G,a)){if(x.rank===0)continue;const LDd=landDistFrom(G,x.r,x.c);
      for(const y of alivePieces(G,b)){const d=hexDist(x.r,x.c,y.r,y.c);if(d<2)continue;const ld=LDd[tileOf(y.r,y.c).id];const gain=(ld<0?40:ld)-d;
        if(gain<3)continue;   // already a short walk apart over land: a causeway would add nothing
        const score=d-Math.min(gain,12)*.5+(x.rank===9||y.rank===9?-1.5:0)+rnd()*.5;if(!best||score<best.score)best={score,x,y,a,b}}}}
  if(!best)return null;
  // shortest route over every tile, water or not
  const s0=tileOf(best.x.r,best.x.c).id,t0=tileOf(best.y.r,best.y.c).id;const prev=new Int32Array(TILES.length).fill(-2);prev[s0]=-1;const q=[s0];
  for(let h=0;h<q.length&&prev[t0]===-2;h++)for(const m of TILES[q[h]].nb)if(prev[m]===-2){prev[m]=q[h];q.push(m)}
  if(prev[t0]===-2)return null;
  const tiles=[];for(let v=prev[t0];v>=0&&v!==s0;v=prev[v]){const T=TILES[v];if(blocked(T.r,T.c,G)){const k=T.r+','+T.c;G.sunk[k]='land';G.temp[k]=G.round+6;tiles.push({r:T.r,c:T.c,kind:'rise',causeway:true})}}
  if(!tiles.length)return null;
  addLog(G,`A causeway rises from the sea between ${DOMAINS[best.a].name} and ${DOMAINS[best.b].name}. It will sink again in a few rounds.`);
  return{tiles,a:best.a,b:best.b};
}
function quake(G){
  if(!G.decisive||G.round<QUAKE_START)return;
  G.sunk=G.sunk||{};
  const occ=new Set(G.pieces.filter(x=>x.alive).map(x=>x.r+','+x.c));
  const step=Math.floor((G.round-QUAKE_START)/10);
  // the island keeps at least half of itself above water: past that it only rearranges, sinking one and raising one
  const landNow=CELLS.filter(([r,c])=>!blocked(r,c,G)).length,floor=Math.round(CELLS.length*.5);
  let nSink=landNow>floor?Math.min(5,2+step):1,nRise=landNow>floor?Math.max(1,nSink-2):1;
  G.temp=G.temp||{};
  // causeways that have served their purpose sink back into the sea
  const back=[];
  for(const k in G.temp){if(G.temp[k]>G.round)continue;const [r,c]=k.split(',').map(Number);
    if(occOf(G,r,c)){G.temp[k]=G.round+1;continue}
    const prev=G.sunk[k];G.sunk[k]='sea';if(!landConnected(G,null,false)||boxesIn(G,r,c)){if(prev)G.sunk[k]=prev;else delete G.sunk[k];G.temp[k]=G.round+2;continue}
    delete G.temp[k];back.push({r,c,kind:'sea'})}
  const all=CELLS;
  const near=bfs(G,G.pieces.filter(x=>x.alive).map(x=>[x.r,x.c]));
  const tiles=back.slice();rescue(G,tiles);const F0=separation(G);
  // sink: empty land far from everyone, which changes rival routes the least
  for(let i=0;i<nSink;i++){
    let done=false;
    for(const lordsOnly of [false]){
      if(done)break;
      const cands=all.filter(([r,c])=>!blocked(r,c,G)&&!occ.has(r+','+c)&&!G.temp[r+','+c]).map(t=>({t,s:Math.min(near[t[0]*N+t[1]],12)+rnd()*2.5})).sort((a,b)=>b.s-a.s).slice(0,10);
      let best=null,bs=Infinity;
      for(const {t:[r,c],s:far} of cands){const k=r+','+c;if(!landConnected(G,k,false)||boxesIn(G,r,c))continue;
        const prev=G.sunk[k];G.sunk[k]='sea';const F=separation(G);if(prev)G.sunk[k]=prev;else delete G.sunk[k];
        const sc=(F-F0)*3-far;if(sc<bs){bs=sc;best=[r,c]}}
      if(best){const k=best[0]+','+best[1];G.sunk[k]='sea';tiles.push({r:best[0],c:best[1],kind:'sea'});done=true;if(lordsOnly&&!G.saidSqueeze){G.saidSqueeze=true;addLog(G,'The sea closes in. Now only the roads between the Lords are spared.')}}
    }
  }
  // rise: seabed that shortens the routes between rivals the most (the island takes no sides)
  const F1=separation(G);
  for(let i=0;i<nRise;i++){
    const cands=all.filter(([r,c])=>blocked(r,c,G)&&nbrs(r,c).some(([a,b])=>!blocked(a,b,G)));
    let best=null,bg=0;const base=separation(G);
    for(const [r,c] of shuffle(cands).slice(0,20)){const k=r+','+c;const prev=G.sunk[k];G.sunk[k]='land';const F=separation(G);if(prev)G.sunk[k]=prev;else delete G.sunk[k];
      const g=base-F+rnd()*.3;if(g>bg){bg=g;best=[r,c]}}
    if(best&&bg>=1){G.sunk[best[0]+','+best[1]]='land';tiles.push({r:best[0],c:best[1],kind:'rise'})}
  }
  // a quiet war: a whole causeway rises between the two closest rival armies, then sinks back a few rounds later
  if(G.round-G.lastCapture>=4&&!Object.keys(G.temp).length){const cw=causeway(G);if(cw){for(const t of cw.tiles)tiles.push(t);G.lastCauseway={a:cw.a,b:cw.b,round:G.round}}}
  // a quiet front: raise ground beside the armies so they can manoeuvre and flank
  if(G.round-G.lastCapture>=8){
    const pcs=G.pieces.filter(x=>x.alive);
    const cands=all.filter(([r,c])=>blocked(r,c,G)&&nbrs(r,c).some(([a,b])=>!blocked(a,b,G))&&pcs.some(x=>hexDist(x.r,x.c,r,c)<=2));
    // prefer seabed that sits near pieces of two or more domains
    const score=([r,c])=>new Set(pcs.filter(x=>hexDist(x.r,x.c,r,c)<=3).map(x=>x.p)).size+rnd();
    cands.sort((x,y)=>score(y)-score(x));
    for(const [r,c] of cands.slice(0,2)){G.sunk[r+','+c]='land';tiles.push({r,c,kind:'rise'})}
  }
  if(tiles.length){G.quakes++;G.lastQuake={n:G.quakes,tiles,round:G.round};
    const s=tiles.filter(t=>t.kind==='sea').length,u=tiles.length-s;
    addLog(G,`The island shifts. ${s?`${s} square${s>1?'s':''} sink${s>1?'':'s'} beneath the waves`:''}${s&&u?' and ':''}${u?`${u} rise${u>1?'':'s'} from the seabed`:''}.`);
    G.islandDone=false;}
  else if(!G.islandDone){G.islandDone=true;G.doneSince=G.round;addLog(G,'The island is still. Only the roads between the armies remain.')}
  if(!tiles.some(t=>t.kind==='sea')&&!G.islandDone){} // keep going
  if(tiles.length&&!tiles.some(t=>t.kind==='sea')){G.noSink=(G.noSink||0)+1;if(G.noSink>=3&&!G.islandDone){G.islandDone=true;G.doneSince=G.round}}else G.noSink=0;
}

// ---------- knowledge ----------
// Is piece x's rank visible to player v?
const visibleTo=(x,v)=>x.p===v||x.revealed||x.known.includes(v);
// Probability distribution over ranks for an unknown piece from player v's point of view.
function belief(G,x,v){
  const out={};
  if(visibleTo(x,v)){out[x.rank]=1;return out}
  const mine=G.pieces.filter(q=>q.p===x.p);

async function turnLoop(my){

    const p=G.turn;renderAll();
    if(G.ctrl[p]==='ai'){
      setViewer();if(!humans().length)RD.faceDomain(p);
      $('#turnBox').innerHTML=`<h3>${D[p].name} is thinking</h3><p class="muted">${humans().length?'Watch the field. Every clash is fought in the open.':'Six computer rulers fight it out.'}</p>`;
      await sleep(aiDelay());if(my!==token)return;
      const before=G.log.length;
      LD.aiDiplomacy(G,p);
      for(const l of G.log.slice(before)){if(/pact/.test(l.t))SND.play('pact');else SND.play('rumor');toast(esc(l.t),2200);await sleep(Math.min(900,aiDelay()*2))}
      const m=LD.aiChoose(G,p);
      if(m)await perform(m);
    }else{
      if(isHot()){V.hideAll=true;renderAll();await ask(`${D[p].name}'s turn`,`<p>Pass the screen to the ruler of ${dom(p)}.</p>`,[{t:'Show my domain',v:1,cls:'gold'}]);V.hideAll=false}
      if(my!==token)return;
      setViewer();RD.faceDomain(p);renderAll();
      await handleOffers(p);if(my!==token)return;
      const m=await humanTurn(p);if(my!==token)return;
      if(m)await perform(m);
    }
    if(my!==token)return;
    LD.nextTurn(G);
    const ch=ENV.advance(G.env,G.round);if(ch==='season'){toast(`<b>${ENV.SEASON_NAME[G.env.season]}</b> comes to the island.`,2600);LD.addLog(G,`${ENV.SEASON_NAME[G.env.season]} comes to the island.`)}
    await showQuake(my);
    cueMusic();save();
  }

}

async function perform(m){
  const x=G.pieces[m.id];const vw=V.viewer;
  const t=m.attack?LD.at(G,m.r,m.c):null;
  const preA=LD.visibleTo(x,vw<0?x.p:vw),preD=t?LD.visibleTo(t,vw<0?t.p:vw):false;
  const positions=G.pieces.map(q=>({r:q.r,c:q.c}));
  const ev=LD.doMove(G,m.id,m.r,m.c);
  V.last={from:{r:positions[m.id].r,c:positions[m.id].c},to:{r:m.r,c:m.c}};
  for(const e of ev){
    if(e.type==='move'){RD.animMove(e.id,e.from,e.to,S.speed==='fast'?160:260);SND.play('move');await sleep(S.speed==='fast'?170:280)}
    else if(e.type==='clash'){
      // keep both fighters on the board during the lunge, then restore the real outcome
      const finalAlive=G.pieces.map(q=>q.alive);const A=G.pieces[e.att];const realA={r:A.r,c:A.c};
      A.alive=true;G.pieces[e.def].alive=true;A.r=e.from.r;A.c=e.from.c;
      RD.animMove(e.att,e.from,e.to,220,true,.4);

      else{SND.play('clash');RD.V.shake=5;await sleep(250)}
      A.r=realA.r;A.c=realA.c;G.pieces.forEach((q,i)=>q.alive=finalAlive[i]);
      // a domain that fell keeps its pieces dead
      for(const q of G.pieces)if(!G.alive[q.p])q.alive=false;
      const wA=RD.worldOf(e.from.r,e.from.c),wD=RD.worldOf(e.to.r,e.to.c);
      if(e.result<=0)RD.burst(wA.x,wA.y,[TM[e.ap].P,TM[e.ap].L,'#fff'],26,1.2);
      if(e.result>=0)RD.burst(wD.x,wD.y,[TM[e.dp].P,TM[e.dp].L,'#fff'],26,1.2);
      if(e.result>0)RD.animMove(e.att,e.from,e.to,200);
      RD.floatText(wD.x,wD.y,e.result>0?'VICTORY':e.result<0?'REPELLED':'BOTH FALL',e.result>0?'#ffe070':'#ff9090');

    }

      SND.play('fall');V.shake=10;
      for(const q of G.pieces)if(q.p===e.p){const w=RD.worldOf(q.r,q.c);RD.burst(w.x,w.y,[TM[e.p].P,TM[e.p].L,TM[e.p].Q,'#ffe070'],18,1.5,2.5)}
      toast(e.how==='keep'?`<b style="color:${TM[e.p].L}">The Keep of ${D[e.p].name} is breached!</b><br>The whole domain collapses${e.by!=null?` before ${D[e.by].name}`:''}.`:`<b style="color:${TM[e.p].L}">The Lord of ${D[e.p].name} has fallen!</b><br>The whole domain collapses${e.by!=null&&e.by!==e.p?` before ${D[e.by].name}`:''}.`,3600);
      await sleep(1400);

        const c=await ask('Your Lord has fallen',`<p>${dom(e.p)} is no more. The other domains fight on.</p>`,[{t:'Title screen',v:'title'},{t:'Watch the rest',v:'watch'},{t:'New game',v:'new',cls:'gold'}]);

        if(c==='new'){begin(store.get('seats',['human','normal','normal','normal','normal','normal']));return}

      }

    else if(e.type==='betray'){SND.play('betray');toast(`<b style="color:#ff8080">Betrayal!</b> ${D[e.a].name} breaks its pact with ${D[e.b].name}.`,3000);await sleep(600)}

   {title:'Killing a Lord',t:'Only three things beat a Lord: a <b>Spy</b> that strikes it first, another <b>Lord</b> that strikes first (when two Lords meet, the one who attacks wins and the one who waits falls, so timing is everything), or a <b>Keep</b> it is foolish enough to attack. A Lord that strikes a Spy first wins. You have two Spies. Keep them close to where you think an enemy Lord hides.'},
   {title:'Breaking a Keep',t:'A Keep destroys anything that attacks it, except a <b>Sapper</b>. If a Sapper breaks a domain\'s Keep, that whole domain falls. Guard your Keep, and send your Sapper after theirs.'},
   {title:'The restless island',t:`In Decisive mode, from round 6 the island reshapes itself every round. ${LORE_ISLAND}`},
   {title:'Sky and seasons',t:'Time passes as you play: dawn, golden hour, night under the moon. Weather and seasons change too. Leave the board on Normal, or pick a season, weather, time of day or holiday board when you start, and change it any time in Settings. Tap the song name in the corner to choose the music; 🔊 and ♪ mute sound and music.'},
   {title:'Your war now',t:'That is everything. Protect your Lord and your Keep, find theirs, make friends you can betray later, and trust carefully.'}];
  coach.on=true;coach.i=0;
  begin(['human','easy','easy','easy','easy','easy'],{mode:'decisive',board:'spring',tutorial:true});
  coachShow();
}
// ---------- game over ----------
function gameOver(){
  V.viewer=-1;V.sel=null;V.legal=[];renderAll();
  const w=G.winner;const human=G.ctrl[w]==='human';const solo=humans().length===1;
  SND.play(human||!solo?'victory':'lose');setTimeout(cueMusic,2500);coachStop();
  const lords=G.pieces.filter(x=>x.rank===9);
  modal(`<h2>${solo?(human?'Victory!':'Defeat'):`${D[w].name} wins`}</h2>
   <p>${G.stalemate?`The war ground to a halt. ${dom(w)} held the strongest army.`:`${dom(w)} is the last domain standing.`}</p>
   <p class="muted">${G.round} rounds · ${G.stats.clashes} clashes · ${G.stats.betrayals} betrayals</p>
   <p>Every piece is now revealed on the field. The computer rulers were: ${LD.ALLP.filter(p=>G.ctrl[p]==='ai').map(p=>`${D[p].name} (${G.persona[p]})`).join(', ')||'none'}.</p>
   <div class="row"><button class="btn" data-a="menu">Title screen</button><button class="btn" data-a="look">Look at the board</button><button class="btn gold" data-a="again">Play again</button></div>`,m=>{
    m.querySelector('[data-a=menu]').onclick=()=>{closeModal();store.set('save',null);showTitle()};
    m.querySelector('[data-a=look]').onclick=closeModal;
    m.querySelector('[data-a=again]').onclick=()=>{closeModal();begin(store.get('seats',['human','normal','normal','normal','normal','normal']))};
  });
  store.set('save',null);
  $('#turnBox').innerHTML=`<h3>The war is over</h3><p>${dom(w)} rules the island. Every piece is revealed.</p><div class="drow"><button class="btn gold" id="again2">Play again</button><button class="btn" id="title2">Title screen</button></div>`;
  $('#again2').onclick=()=>begin(store.get('seats',['human','normal','normal','normal','normal','normal']));$('#title2').onclick=showTitle;
}
// ---------- save / continue ----------
function save(){if(G&&!G.over&&G.phase==='play'){G.v6=1;store.set('save',G)}}
function cont(){const g=store.get('save',null);if(!g)return;token++;clearInterval(titleTimer);coachStop();G=g;if(!G.env)G.env=ENV.create('random');LD.setG(G);seenQuake=G.lastQuake?G.lastQuake.n:0;RD.CUR.G=G;V.title=false;$('#titleMenu').hidden=true;V.mode=S.view;V.sel=null;V.legal=[];setViewer();if(humans().length===1)RD.faceDomain(humans()[0],true);renderAll();turnLoop(token)}
// ---------- rules ----------
function rules(){
  const rows=[9,8,7,6,5,4,3,2,1,0].map(k=>`<img src="${sprURL(k,0)}" alt=""><div><b>${LD.RANK_NAME[k]}</b>${k!==9&&k!==0?` (${k})`:''} · ${LD.RANK_TIP[k]}</div>`).join('');
  modal(`<h2>How to play</h2><div class="rules">
  <p>${LORE_SHORT}</p>
  <p>Six domains share the island: Crimson, Azure, Verdant, Golden, Violet and Teal. Each has fourteen pieces, and one of them is its <b>Lord</b>. The island is a six-sided field of hexes, and each army starts along one side. You know where your own Lord is. Everyone else's is a mystery.</p>
  <h3>Winning</h3><ul><li>If a Lord falls, its whole domain falls with it.</li><li>If a Sapper breaks a domain's Keep, that domain falls too.</li><li>The last domain standing wins.</li><li>Classic mode: if no one fights for 40 rounds (or after 200 rounds), the strongest remaining army wins.</li></ul>
  <h3>Modes</h3><ul><li><b>Classic:</b> the island stands still.</li><li><b>Decisive, the restless island:</b> from round 6, every round empty land far from the fighting sinks into the sea and seabed rises as new land where it brings rivals closer. It never sinks a space with a piece on it and never cuts any piece off from the rest. When the fighting stalls, a causeway, a whole line of seabed, rises between the nearest rivals for a few rounds and then sinks back. Nothing is ever isolated; the sea only makes obstacles. ${LORE_ISLAND}</li></ul>
  <h3>Your turn</h3><ul><li>Every space is a hex. Move one piece to any of the six spaces that share a side with it. Scouts may run any distance in a straight line in any of the six directions. Keeps never move.</li><li>Water cannot be crossed.</li><li>Moving onto an enemy is an attack. Both pieces are revealed to everyone. The higher rank wins; equal ranks both fall.</li><li>Special fights: a <b>Spy</b> that strikes a Lord first kills it; a Lord that strikes a Spy first wins. Any attacker except a <b>Sapper</b> is destroyed by a <b>Keep</b>, and a Sapper who breaks a Keep topples that domain. A Lord who attacks another Lord wins, and the Lord who waits falls, so time your strike.</li><li>Each domain has 14 pieces: Lord, Marshal, Knight, Captain, Guard, Raider, four Scouts, two Spies, Sapper and Keep.</li></ul>
  <h3>Reading the field</h3><ul><li>Enemy pieces look like hooded figures until they fight or are shown to you.</li><li>Pieces that have moved show small footprints. Keeps never move, so an unmoved piece might be a Keep, or a Lord staying hidden.</li><li>The Domains panel lists each rival's ranks that are still hidden. Inspect any piece to see your best guess.</li></ul>
  <h3>Diplomacy</h3><ul><li><b>Offer a pact:</b> for ${LD.PACT_LEN} rounds neither side attacks the other. Each side is shown one of the other's pieces.</li><li><b>Point the finger:</b> turn the other domains against a rival.</li><li><b>Rumour:</b> crown one of your pieces so rivals think it is your Lord. A Keep makes a nasty surprise.</li><li>You can attack an ally, but that breaks the pact, and every domain trusts you less.</li><li>Computer rulers have hidden personalities. Some keep their word. Some do not.</li></ul>
  <h3>The pieces</h3><div class="rtbl">${rows}</div>
  <h3>Sky, seasons and holidays</h3><ul><li>Time passes as you play: a full day every ${ENV.DAY_ROUNDS} rounds, from dawn through golden hour to night.</li><li>Every game starts in a random season (or the one you pick), and the weather follows it: sun, cloud, rain, storms, snow and fog.</li><li>Holiday boards: ${Object.values(ENV.HOLIDAYS).map(h=>h.name).join(', ')}.</li><li>Music follows the mood: ten songs for the title, deploying, each season, night and fog, rain and storms, the last fight and victory.</li></ul>
  <h3>Views</h3><ul><li><b>Field</b> is the low view from behind your domain. Rotate with ⟲ ⟳ (Q/E) and zoom with + and −.</li><li><b>Map</b> is the view from above. Press V to switch.</li></ul>
  </div><div class="row"><button class="btn gold" data-x>Close</button></div>`,m=>m.querySelector('[data-x]').onclick=closeModal);
}
// ---------- settings ----------
function seg(key,opts){return `<span class="seg" data-k="${key}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(S[key])===String(v)?'on':''}">${l}</button>`).join('')}</span>`}
function settings(){
  modal(`<h2>Settings</h2>
   <div class="setrow"><span>View</span>${seg('view',[['field','Field'],['map','Map']])}</div>
   <div class="setrow"><span>Battle scenes</span>${seg('battle',[['full','Full'],['quick','Quick'],['off','Off']])}</div>
   <div class="setrow"><span>Computer speed</span>${seg('speed',[['slow','Slow'],['normal','Normal'],['fast','Fast']])}</div>
   <div class="setrow"><span>Sound effects</span>${seg('sound',[[true,'On'],[false,'Off']])}</div>
   <div class="setrow"><span>Music</span>${seg('music',[[true,'On'],[false,'Off']])}</div>
   <div class="setrow"><span>Guess bars on unknown pieces</span>${seg('hints',[[true,'On'],[false,'Off']])}</div>
   <div class="setrow"><span>Page theme</span>${seg('theme',[['auto','Auto'],['light','Light'],['dark','Dark']])}</div>
   <h3 style="color:var(--gold);margin:12px 0 4px">Board</h3><p class="muted" style="font-size:.85rem">${G&&!V.title?'Changes apply to this game straight away.':'Used for your next game.'}</p>${boardSelects()}
   <div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn sm" id="applyBoard">Apply board</button></div>
   <div class="setrow"><span>Watching computers: show all pieces</span>${seg('revealAll',[[true,'Yes'],[false,'No']])}</div>
   <div class="row"><button class="btn gold" data-x>Done</button></div>`,m=>{
    m.querySelector('[data-x]').onclick=closeModal;
    wireBoardSelects(m);
    m.querySelector('#applyBoard').onclick=()=>{readBoardSelects(m);saveS();
      if(G&&!V.title&&G.env){const before=RD.curTime();ENV.apply(G.env,S.board,{weather:S.weather,time:S.time});
        if(G.env.lockTime==null){const el=((G.round-1)*6+(G.phase==='play'?G.turn:0))/(ENV.DAY_ROUNDS*6);G.env.startTime=((before-el)%1+1)%1}
        save();cueMusic();toast(`The island now: ${esc(ENV.describe(G.env,RD.curTime()))}.`)}
      else toast('Saved for your next game.')};
    m.querySelectorAll('.seg').forEach(sg=>sg.onclick=e=>{const b=e.target.closest('button');if(!b)return;let v=b.dataset.v;if(v==='true')v=true;if(v==='false')v=false;S[sg.dataset.k]=v;saveS();
      sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      if(sg.dataset.k==='view'){V.mode=v;syncView()}if(sg.dataset.k==='sound')SND.set(v);if(sg.dataset.k==='music')SND.music(v);if(sg.dataset.k==='theme')applyTheme();if(sg.dataset.k==='revealAll'&&G){setViewer();renderAll()}});
  });
}
function syncView(){$('#bView').textContent='View: '+(V.mode==='field'?'Field':'Map');const f=V.mode==='field';['#bRotL','#bRotR','#bZoomIn','#bZoomOut'].forEach(s=>$(s).disabled=!f)}
// ---------- input ----------
function toInternal(e){const r=RD.cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*RD.W,y:(e.clientY-r.top)/r.height*RD.H}}
RD.cv.addEventListener('click',e=>{
  SND.unlock();
  if(BT.active){BT.skip();return}
  if(V.title){newGameModal();return}
  if(!waiting||busy)return;
  const p=toInternal(e);const hit=RD.pick(p.x,p.y);
  if(!hit){if(waiting.kind==='move'){V.sel=null;V.legal=[]}return}
  if(hit.id==null){const x=LD.at(G,hit.r,hit.c);if(x)hit.id=x.id}
  waiting.click(hit);
});
RD.cv.addEventListener('mousemove',e=>{
  if(!G||V.title||BT.active)return;const p=toInternal(e);const hit=RD.pick(p.x,p.y);
  V.hover=hit?{r:hit.r,c:hit.c}:null;
  if(hit){const x=hit.id!=null?G.pieces[hit.id]:LD.at(G,hit.r,hit.c);if(x&&x.id!==lastInspect){lastInspect=x.id;inspect(x)}}
});
let lastInspect=null;
RD.cv.addEventListener('mouseleave',()=>{V.hover=null});
addEventListener('keydown',e=>{
  if(!$('#modalBg').hidden){if(e.key==='Escape'&&!G?.over)closeModal();return}
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k==='v'){V.mode=V.mode==='field'?'map':'field';S.view=V.mode;saveS();syncView();coachEmit('view')}
  if(k==='q')RD.rotate(-Math.PI/4);if(k==='e')RD.rotate(Math.PI/4);
  if(k==='+'||k==='=')RD.zoom(-20);if(k==='-')RD.zoom(20);
  if(k==='escape'){V.sel=null;V.legal=[];V.swapSel=null}
  if(k===' '&&BT.active){e.preventDefault();BT.skip()}
});
$('#bView').onclick=()=>{V.mode=V.mode==='field'?'map':'field';S.view=V.mode;saveS();syncView();coachEmit('view')};
$('#bRotL').onclick=()=>RD.rotate(-Math.PI/4);$('#bRotR').onclick=()=>RD.rotate(Math.PI/4);
$('#bZoomIn').onclick=()=>RD.zoom(-20);$('#bZoomOut').onclick=()=>RD.zoom(20);
$('#bRules').onclick=rules;$('#tRules').onclick=rules;$('#bSettings').onclick=settings;$('#tSet').onclick=settings;
$('#tNew').onclick=newGameModal;$('#tCont').onclick=cont;$('#tWalk').onclick=startWalkthrough;
$('#bMenu').onclick=async()=>{if(G&&!V.title&&!G.over){const ok=await ask('Leave this game?','<p>Your game is saved after every turn. You can continue it from the title screen.</p>',[{t:'Stay',v:false},{t:'Title screen',v:true,cls:'gold'}]);if(!ok)return}token++;waiting=null;showTitle()};
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg'&&!$('#modal [data-i]'))closeModal()});
// expose for tests
window.LDG={get G(){return G},S,V,begin,perform,store,get waiting(){return waiting}};
SND.music(S.music);renderCorner();
// first interaction unlocks audio in the browser
addEventListener('pointerdown',()=>{SND.unlock();cueMusic()},{once:true});
syncView();RD.start();showTitle();
})();

</script>
</body>
</html>
